name = "tg-proxy"
main = "src/index.ts"
compatibility_date = "2024-01-26"

# CHAT_ID вынесен из [vars] в секрет Worker'а (этап 10):
#   npx wrangler secret put CHAT_ID
# Значение в репозитории не хранится. Пока секрет не задан, отправка в Telegram не работает.

[[kv_namespaces]]
binding = "CATALOG_KV"
id = "fe7b04ba504643ce9f085d1213bd5a09"

# Durable Object для атомарной idempotency (этап 3)
[[durable_objects.bindings]]
name = "IDEMPOTENCY"
class_name = "IdempotencyObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["IdempotencyObject"]