<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заказать проект — 3DArtStudio</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'JetBrains Mono',monospace;background:#0a1929;color:#e0f2fe;line-height:1.6;background-image:linear-gradient(rgba(59,130,246,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(59,130,246,.06) 1px,transparent 1px);background-size:40px 40px}
.container{max-width:1200px;margin:0 auto;padding:0 24px}

nav{padding:24px 0;border-bottom:1px solid rgba(59,130,246,.2);position:sticky;top:0;background:rgba(10,25,41,.95);backdrop-filter:blur(10px);z-index:10}
.nav-inner{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:700;font-size:18px;color:#60a5fa;letter-spacing:1px;text-decoration:none}
.logo::before{content:"> "}
.back{color:#cbd5e1;text-decoration:none;font-size:13px;transition:color .2s;display:flex;align-items:center;gap:8px}
.back:hover{color:#60a5fa}

.order-page{padding:80px 0 120px}
.order-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:start}
.order-visual{position:relative;border-radius:4px;overflow:hidden;aspect-ratio:4/3}
.order-visual img{width:100%;height:100%;object-fit:cover}

.order-content h1{font-size:clamp(32px,4vw,48px);font-weight:700;line-height:1.1;margin-bottom:16px;color:#f0f9ff}
.order-content h1 .accent{color:#3b82f6}
.order-content .sub{font-family:'Inter',sans-serif;font-size:16px;color:#94a3b8;margin-bottom:40px;font-weight:400}

.form-card{background:rgba(15,35,55,.6);border:1px solid rgba(59,130,246,.2);border-radius:4px;padding:40px}
.form-card h3{font-family:'Inter',sans-serif;font-size:22px;font-weight:500;margin-bottom:8px;color:#f0f9ff}
.form-card .sub{font-family:'Inter',sans-serif;font-size:14px;color:#94a3b8;margin-bottom:28px}
.form-row{margin-bottom:18px}
.form-row label{display:block;font-size:11px;color:#60a5fa;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;font-weight:500}
.form-row input,.form-row textarea,.form-row select{width:100%;padding:14px 16px;background:rgba(10,25,41,.8);border:1px solid rgba(59,130,246,.2);border-radius:2px;color:#e0f2fe;font-family:'JetBrains Mono',monospace;font-size:14px;transition:border-color .2s}
.form-row input:focus,.form-row textarea:focus{outline:none;border-color:#3b82f6}
.form-row textarea{resize:vertical;min-height:100px}
.form-row select{cursor:pointer}
.btn-submit{width:100%;padding:16px;background:#3b82f6;color:#0a1929;border:none;border-radius:2px;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;letter-spacing:.5px}
.btn-submit:hover{background:#60a5fa}
.form-note{font-family:'Inter',sans-serif;font-size:13px;color:#64748b;text-align:center;margin-top:16px}

footer{padding:40px 0;border-top:1px solid rgba(59,130,246,.2);text-align:center;font-size:12px;color:#64748b;letter-spacing:1px}

@media(max-width:768px){
  .order-grid{grid-template-columns:1fr}
  .form-card{padding:28px}
}
</style>
</head>
<body>
<nav>
  <div class="container nav-inner">
    <a href="index.html" class="logo">3DArtStudio</a>
    <a href="index.html" class="back">← НА ГЛАВНУЮ</a>
  </div>
</nav>

<section class="order-page">
  <div class="container">
    <div class="order-grid">
      <div class="order-visual">
        <img src="../images/hero-order.webp" alt="3D печать деталей">
      </div>
      <div class="order-content">
        <h1>Заказать <span class="accent">проект</span></h1>
        <p class="sub">Опишите задачу — свяжусь в течение 2 часов, уточню детали и назову точную цену.</p>
        <div class="form-card">
          <form>
            <div class="form-row"><label>Имя</label><input type="text" placeholder="Как к вам обращаться"></div>
            <div class="form-row"><label>Телефон или Telegram</label><input type="text" placeholder="+7 ... или @username"></div>
            <div class="form-row"><label>Материал</label>
              <select><option value="">Выберите материал</option><option>PLA</option><option>PETG</option><option>ABS</option><option>Nylon</option><option>Другой / не знаю</option></select>
            </div>
            <div class="form-row"><label>Что нужно напечатать?</label><textarea placeholder="Описание детали, размеры, назначение..."></textarea></div>
            <div class="form-row"><label>Размеры (если известны)</label><input type="text"placeholder="Длина × Ширина × Высота в мм"></div>
            <button type="submit" class="btn-submit">ОТПРАВИТЬ ЗАЯВКУ →</button>
          </form>
          <p class="form-note">Ответ в течение 2 часов · Без предоплаты</p>
        </div>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="container">// 3DArtStudio © 2026 · Кастомная 3D-печать · Москва</div>
</footer>
</body>
</html>
