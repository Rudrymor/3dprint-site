<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заказать проект — 3DArtStudio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#fff;color:#0a0a0a;line-height:1.5;-webkit-font-smoothing:antialiased}
.container{max-width:1320px;margin:0 auto;padding:0 40px}

nav{padding:24px 0;border-bottom:1px solid #f0f0f0;position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);z-index:10}
.nav-inner{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:600;font-size:18px;letter-spacing:4px;color:#0a0a0a;text-decoration:none}
.back{color:#666;text-decoration:none;font-size:13px;font-weight:500;transition:color .2s;display:flex;align-items:center;gap:8px}
.back:hover{color:#0a0a0a}

.order-page{padding:80px 0 120px}
.order-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:start}
.order-visual{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:4/3}
.order-visual img{width:100%;height:100%;object-fit:cover}

.order-content h1{font-size:clamp(36px,5vw,56px);font-weight:300;line-height:1.05;letter-spacing:-1.5px;margin-bottom:16px}
.order-content h1 .thin{font-weight:200;color:#999}
.order-content .sub{font-size:16px;color:#555;margin-bottom:40px}

.form-card{background:#fafafa;border:1px solid #f0f0f0;border-radius:12px;padding:40px}
.form-card h3{font-size:24px;font-weight:500;margin-bottom:8px;letter-spacing:-.5px}
.form-card .sub{font-size:14px;color:#999;margin-bottom:28px}
.form-row{margin-bottom:18px}
.form-row label{display:block;font-size:12px;color:#666;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;font-weight:500}
.form-row input,.form-row textarea,.form-row select{width:100%;padding:14px 16px;background:#fff;border:1px solid #e5e5e5;border-radius:6px;color:#0a0a0a;font-family:'Inter',sans-serif;font-size:15px;transition:border-color .2s}
.form-row input:focus,.form-row textarea:focus{outline:none;border-color:#0a0a0a}
.form-row textarea{resize:vertical;min-height:100px}
.form-row select{cursor:pointer}
.btn-submit{width:100%;padding:16px;background:#0a0a0a;color:#fff;border:none;border-radius:6px;font-family:'Inter',sans-serif;font-size:15px;font-weight:500;cursor:pointer;transition:all .2s}
.btn-submit:hover{background:#333}
.form-note{font-size:13px;color:#999;text-align:center;margin-top:16px}

footer{padding:60px 0 40px;border-top:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center}
footer p{font-size:13px;color:#999}

@media(max-width:768px){
  .order-grid{grid-template-columns:1fr}
  .form-card{padding:28px}
}
</style>
</head>
<body>
<nav>
  <div class="container nav-inner">
    <a href="index.html" class="logo">3DARTSTUDIO</a>
    <a href="index.html" class="back">← На главную</a>
  </div>
</nav>

<section class="order-page">
  <div class="container">
    <div class="order-grid">
      <div class="order-visual">
        <img src="../images/hero-order.webp" alt="3D печать деталей">
      </div>
      <div class="order-content">
        <h1>Заказать<br><span class="thin">проект</span></h1>
        <p class="sub">Опишите задачу — свяжусь в течение 2 часов, уточню детали и назову точную цену.</p>
        <div class="form-card">
          <form>
            <div class="form-row"><label>Имя</label><input type="text" placeholder="Как к вам обращаться"></div>
            <div class="form-row"><label>Телефон или Telegram</label><input type="text" placeholder="+7 ... или @username"></div>
            <div class="form-row"><label>Материал</label>
              <select><option value="">Выберите материал</option><option>PLA</option><option>PETG</option><option>ABS</option><option>Nylon</option><option>Другой / не знаю</option></select>
            </div>
            <div class="form-row"><label>Что нужно напечатать?</label><textarea placeholder="Описание детали, размеры, назначение..."></textarea></div>
            <div class="form-row"><label>Размеры (если известны)</label><input type="text" placeholder="Длина × Ширина × Высота в мм"></div>
            <button type="submit" class="btn-submit">Отправить заявку</button>
          </form>
          <p class="form-note">Ответ в течение 2 часов · Без предоплаты</p>
        </div>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="container">
    <div class="logo" style="font-size:16px">3DARTSTUDIO</div>
    <p>© 2026 · 3D-печать на заказ · Москва</p>
  </div>
</footer>
</body>
</html>
